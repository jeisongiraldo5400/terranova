# ===========================================================================
# TERRANOVA
# ---------------------------------------------------------------------------
# Desarrollo diario (solo la base; la app corre con `pnpm dev`):
#   docker compose -f infra/docker-compose.yml up -d
#
# Las variables de este archivo salen de infra/.env, que compose lee solo
# por estar en la misma carpeta. Las de la API y la web, de su propia app.
#
# Pila completa en contenedores:
#   docker compose -f infra/docker-compose.yml --profile completo up -d --build
# ===========================================================================

name: terranova

services:
  postgres:
    image: postgres:17-alpine
    container_name: terranova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terranova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terranova_local}
      POSTGRES_DB: ${POSTGRES_DB:-terranova}
      # Ordenamiento y acentos correctos para busquedas en espanol
      POSTGRES_INITDB_ARGS: '--locale=es_CO.UTF-8 --encoding=UTF8'
      # UTC a proposito, NO America/Bogota.
      #
      # Las fechas de negocio (venta, pago, vencimiento) son columnas DATE.
      # Al convertir un timestamp UTC a DATE, Postgres lo reinterpreta en la
      # zona de la sesion: con TZ=America/Bogota (UTC-5), el instante
      # 2026-09-01T00:00:00Z cae el 2026-08-31 19:00 local y la fecha se
      # guardaba un dia antes. Una venta del 1 de septiembre terminaba
      # registrada el 31 de agosto.
      #
      # Se almacena en UTC y se presenta en hora de Colombia en la interfaz.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-terranova} -d ${POSTGRES_DB:-terranova}']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Aplicacion ---------------------------------------------------------
  # Bajo el perfil `completo`, de modo que el desarrollo diario siga usando
  # `pnpm dev` contra esta misma base sin levantar imagenes.
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: terranova-api
    profiles: ['completo']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Secretos JWT, CORS_ORIGIN y TTL. Lo que cambia dentro del contenedor
    # (base, puerto, carpeta de contratos) se fija abajo y tiene prioridad.
    env_file:
      - path: ../apps/api/.env
        required: false
    environment:
      NODE_ENV: production
      TZ: UTC
      API_PORT: 3101
      DATABASE_URL: postgresql://${POSTGRES_USER:-terranova}:${POSTGRES_PASSWORD:-terranova_local}@postgres:5432/${POSTGRES_DB:-terranova}?schema=public&options=-c%20timezone%3DUTC
      CONTRATOS_DIR: /datos/contratos
    volumes:
      - contratos:/datos/contratos
    ports:
      - '3101:3101'

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: terranova-web
    profiles: ['completo']
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - path: ../apps/web/.env.local
        required: false
    environment:
      NODE_ENV: production
      TZ: UTC
      # Nombre del servicio, no localhost: la peticion sale del contenedor
      # de la web hacia el de la API por la red interna de Docker.
      API_URL: http://api:3101
    ports:
      - '3100:3100'

volumes:
  postgres-data:
  # Los contratos PDF no viven en la base de datos: sin su propio volumen
  # se perderian al recrear el contenedor.
  contratos:
