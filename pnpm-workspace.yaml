packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Scripts de instalacion, gestionado por `pnpm approve-builds`.
# @scarf/scarf esta denegado a proposito: es telemetria de analitica.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true

catalog:
  react: ^19.2.0
  react-dom: ^19.2.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  typescript: ^5.9.3
  zod: ^3.25.76
  tsx: ^4.20.6
  vitest: ^3.2.4
  '@prisma/client': ^6.17.1
  prisma: ^6.17.1
